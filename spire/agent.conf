agent {
    data_dir = "/opt/spire/data/agent"
    log_level = "INFO"
    server_address = "127.0.0.1"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "lab.local"
    # Lab only: in production, pin trust_bundle_path instead.
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # The unix attestor is how SPIRE identifies processes on a host.
    # discover_workload_path adds unix:path and unix:sha256 selectors, which hash
    # the binary behind /proc/<pid>/exe. For an AI agent written in Python, that
    # binary is the interpreter rather than the agent. Experiment G1 is built on this.
    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }
}
